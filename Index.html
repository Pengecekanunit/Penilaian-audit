<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Input Penilaian &amp; Absensi</title>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#1f2937;--m:#6b7280;--p:#2563eb;--b:#d1d5db}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:14px 16px;font-weight:600}
nav{display:flex;background:var(--c);border-bottom:1px solid var(--b)}
nav button{flex:1;padding:12px 6px;border:0;background:none;font-size:14px;cursor:pointer;color:var(--m);border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p);font-weight:600}
main{max-width:560px;margin:0 auto;padding:14px}
form{background:var(--c);padding:16px;border-radius:12px;display:none;box-shadow:0 1px 3px #0001}
form.on{display:block}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:15px;background:#fff;color:var(--t)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px;color:var(--t);margin:0}
.chk input{width:auto}
button.go{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--p);color:#fff;font-size:16px;cursor:pointer}
button.go:disabled{opacity:.5}
#msg{margin:12px 0;padding:10px;border-radius:8px;display:none;font-size:14px}
.ok{background:#dcfce7;color:#166534}.er{background:#fee2e2;color:#991b1b}
#prev img,.pv img{height:64px;border-radius:6px;margin:6px 6px 0 0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
td,th{border-bottom:1px solid var(--b);padding:6px;text-align:left;white-space:nowrap}th{background:#eef2ff}
h3{margin:18px 0 4px;font-size:15px}
.it{border:1px solid var(--b);border-radius:10px;padding:12px;margin:10px 0}.it span{font-size:13px;color:var(--m)}
</style></head><body>
<header>Penilaian Kerja &amp; Absensi</header>
<nav><button class="on" data-f="fN">Penilaian</button><button data-f="fA">Absensi</button><button data-f="fD">Dinas</button></nav>
<main><div id="msg"></div>

<form id="fN" class="on">
<label>Tanggal</label><input type="date" name="tanggal" required>
<label>Nama Anggota</label><select name="anggota" class="nm" required></select>
<label>Grup</label><select name="grup" id="grup"><option>H1</option><option>H2</option></select>
<label>Tugas</label><select name="tugas" id="tugas" required></select>
<label>Nilai</label><select name="nilai" required><option value="">-- Pilih nilai --</option><option value="B">B (Baik)</option><option value="KB">KB (Kurang Baik)</option><option value="TB">TB (Tidak Baik)</option></select>
<label>Filing Report / Catatan</label><textarea name="catatan" rows="3"></textarea>
<label>Upload Foto Bukti (maks. 3)</label><input type="file" id="foto" accept="image/*" multiple>
<div id="prev"></div>
<button class="go">Simpan Penilaian</button></form>

<form id="fD">
<label>Tanggal Mulai</label><input type="date" name="mulai" required>
<label>Tanggal Selesai</label><input type="date" name="selesai" required>
<label>Tujuan / Lokasi Dinas</label><input name="tujuan" required>
<label>Peserta Dinas</label><div id="peserta"></div>
<label>Keterangan</label><textarea name="keterangan" rows="2"></textarea>
<button class="go">Simpan Absen Dinas</button></form>

<form id="fA">
<label>Upload File Absensi (.xlsx / .xls / .csv)</label><input type="file" id="rf" accept=".xlsx,.xls,.csv">
<div id="map" style="display:none">
<label>Kolom Nama</label><select id="cN"></select>
<label>Kolom Tanggal</label><select id="cT"></select>
<label>Kolom Jam Masuk</label><select id="cJ"></select>
<label>Kolom Keterangan (opsional)</label><select id="cK"></select>
<label>Jam masuk standar</label><input type="time" id="std" value="08:00"><input id="offk" type="hidden" value="off, libur, cuti, alpha, sakit, dinas">
<button type="button" class="go" id="proc">Proses Rekap</button></div>
<div id="out"></div>
<hr style="margin:20px 0;border:0;border-top:1px solid var(--b)">
<button type="button" class="go" id="tbtn" style="background:#475569">Lihat Total Bulanan</button><div id="tb"></div></form>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Tempel URL Web App dari Apps Script (Deploy > Manage deployments) di sini
const API_URL='PASTE_URL_WEB_APP_DI_SINI';
async function call(action,data){
 const kode=localStorage.getItem('kode')||prompt('Masukkan kode akses')||'';
 const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,kode,data})});
 const j=await r.json();
 if(!j.ok){if(j.error==='KODE_SALAH'){localStorage.removeItem('kode');throw new Error('Kode akses salah, coba lagi')}throw new Error(j.error)}
 localStorage.setItem('kode',kode);return j.result}
const NAMA=["Galih Tegar Wicaksono","Ikhwan Lazuardy Anwar","Agung Kurniawan","Brilliandi Asa Fardana"];
const NAMA_ABS=[...NAMA,"Kiki Afandi"];
const TUGAS={H1:["Kepala Gudang","Kasir","STNK BPKB","Admin AR","Admin SO","Kebersihan H1"],
 H2:["Servis","Sparepart","Frontdesk","Kebersihan H2"]};
const $=s=>document.querySelector(s),today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
document.querySelectorAll('.nm').forEach(s=>s.innerHTML=NAMA.map(n=>`<option>${n}</option>`).join(''));
$('#peserta').innerHTML=NAMA_ABS.map(n=>`<label class="chk"><input type="checkbox" value="${n}"> ${n}</label>`).join('');
document.querySelectorAll('input[type=date]').forEach(i=>i.value=today);
function tugas(){$('#tugas').innerHTML=TUGAS[$('#grup').value].map(t=>`<option>${t}</option>`).join('')}
$('#grup').onchange=tugas;tugas();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button,form').forEach(e=>e.classList.remove('on'));
 b.classList.add('on');$('#'+b.dataset.f).classList.add('on');$('#msg').style.display='none'});
function msg(t,ok){const m=$('#msg');m.textContent=t;m.className=ok?'ok':'er';m.style.display='block';scrollTo(0,0)}
function resize(file){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');
 c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
 r({data:c.toDataURL('image/jpeg',.75).split(',')[1]})};i.src=URL.createObjectURL(file)})}
$('#foto').onchange=e=>{$('#prev').innerHTML=[...e.target.files].slice(0,3).map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')};
function submit(form,fn,build){form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('.go'),ot=b.textContent;b.disabled=true;b.textContent='Menyimpan…';
 try{const d=await build(Object.fromEntries(new FormData(form)));await call(fn,d);msg('Data berhasil disimpan ✓',1);form.reset();$('#prev').innerHTML='';
  document.querySelectorAll('input[type=date]').forEach(i=>i.value=today);tugas()}
 catch(x){msg('Gagal: '+x.message)}
 b.disabled=false;b.textContent=ot}}
submit($('#fN'),'saveNilai',async d=>{d.fotos=await Promise.all([...$('#foto').files].slice(0,3).map(resize));return d});
$('#fD [name=mulai]').onchange=e=>{const t=$('#fD [name=selesai]');if(!t.value||t.value<e.target.value)t.value=e.target.value};
submit($('#fD'),'saveDinas',async d=>{if(d.selesai<d.mulai)throw new Error('Tanggal selesai tidak boleh sebelum tanggal mulai');d.peserta=[...document.querySelectorAll('#peserta input:checked')].map(c=>c.value);
 if(!d.peserta.length)throw new Error('Pilih minimal 1 peserta');return d});

// ===== Absensi =====
let rows=[],H=[],last=[],TB=null;
const CAT=["Terlambat > 10 menit","Terlambat < 10 menit","Hadir tidak finger print","Tidak swipe in"];
const p2=n=>String(n).padStart(2,'0'),D=v=>new Date(v.getTime()+30000);
const E=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#fA').onsubmit=e=>e.preventDefault();
function toDate(v){if(v instanceof Date){v=D(v);return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate())}
 if(typeof v==='number'&&v>1){const o=XLSX.SSF.parse_date_code(v);return o.y+'-'+p2(o.m)+'-'+p2(o.d)}
 const s=String(v).trim();let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
 m=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);return null}
function toMin(v){if(v instanceof Date){v=D(v);return v.getHours()*60+v.getMinutes()}
 if(typeof v==='number')return Math.floor(((v%1)*1440)+.01);
 const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
const fmt=m=>p2(Math.floor(m/60))+':'+p2(m%60);
$('#rf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
 const all=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
 const hi=all.findIndex(r=>r.filter(x=>x!=='').length>=3);
 H=all[hi].map((h,i)=>String(h||'Kolom '+(i+1)));rows=all.slice(hi+1);
 [['#cN',/nama|name/i],['#cT',/tanggal|tgl|date/i],['#cJ',/masuk|scan|\bin\b|jam|waktu|time/i],['#cK',/ket|status|remark/i]].forEach(([id,re])=>{
  $(id).innerHTML='<option value="-1">(tidak ada)</option>'+H.map((h,i)=>`<option value="${i}">${E(h)}</option>`).join('');
  $(id).value=H.findIndex(h=>re.test(h))});
 $('#map').style.display='block';$('#out').innerHTML='';}catch(x){msg('File tidak bisa dibaca: '+x.message)}};
$('#proc').onclick=()=>{
 const n=+$('#cN').value,t=+$('#cT').value,j=+$('#cJ').value,k=+$('#cK').value;
 if(n<0||t<0||j<0)return msg('Kolom Nama, Tanggal, dan Jam Masuk wajib dipilih');
 const [sh,sm]=$('#std').value.split(':'),std=+sh*60+ +sm,g={},kw=$('#offk').value.split(',').map(x=>x.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).filter(Boolean),re=kw.length?new RegExp('(^|[^a-z])('+kw.join('|')+')([^a-z]|$)','i'):null;
 rows.forEach(r=>{const raw=String(r[n]).toLowerCase(),nm=NAMA_ABS.find(x=>raw.includes(x.split(' ')[0].toLowerCase().slice(0,4)));if(!nm)return;
  const d=toDate(r[t]);if(!d)return;const o=g[nm+'|'+d]=g[nm+'|'+d]||{nm,d,min:null,ket:[]};if(re&&re.test(r.join(' ')))o.off=1;
  const m=toMin(r[j]);if(m!==null&&(o.min===null||m<o.min))o.min=m;
  if(k>=0&&r[k]!=='')o.ket.push(String(r[k]))});
 last=Object.values(g).map(o=>{if(o.off)return null;const kt=o.ket.join('; ');let c=null;
  if(/finger/i.test(kt))c=2;else if(/swipe/i.test(kt)||o.min===null)c=3;
  else if(o.min>std+10)c=0;else if(o.min>std)c=1;
  return c===null?null:{nm:o.nm,d:o.d,c:CAT[c],ci:c,jam:o.min===null?'':fmt(o.min),ket:kt}})
  .filter(Boolean).sort((a,b)=>NAMA_ABS.indexOf(a.nm)-NAMA_ABS.indexOf(b.nm)||a.d.localeCompare(b.d));
 last.forEach(r=>{r.ket2='';r.fotos=[];r.kurang=false});draw()};
function sum(){
 const f=(nm,i,k)=>last.filter(r=>r.nm===nm&&r.ci===i&&r.kurang===k).length;
 let h='<h3>Total per Anggota</h3><div class="tw"><table><tr><th>Nama</th>'+CAT.map(c=>`<th>${E(c)}</th>`).join('')+'<th>Total</th></tr>';
 NAMA_ABS.forEach(nm=>{let t=0;h+=`<tr><td>${nm}</td>`+[0,1,2,3].map(i=>{const a=f(nm,i,false),b=f(nm,i,true);t+=a;
  return `<td>${a}${b?` <small style="color:var(--m)">(&minus;${b})</small>`:''}</td>`}).join('')+`<td><b>${t}</b></td></tr>`});
 $('#sum').innerHTML=h+'</table></div><small style="color:var(--m)">Angka dalam kurung = dikurangi karena &ldquo;bisa mengurangi telat&rdquo;.</small>'}
function draw(){
 const mo=[...new Set(last.map(r=>r.d.slice(0,7)))].sort(),ns=NAMA_ABS.filter(n=>last.some(r=>r.nm===n));
 let h=(mo.length?'<p style="font-size:13px;color:var(--m)">Bulan pada file: <b>'+mo.join(', ')+'</b>. Menyimpan akan menggantikan data bulan tersebut di spreadsheet.</p>':'')+'<div id="sum"></div><h3>Daftar Tanggal</h3>'+
 (ns.length?'<label>Pilih Nama</label><select id="fn"><option value="">Semua nama ('+last.length+')</option>'+ns.map(n=>`<option value="${n}">${n} (${last.filter(r=>r.nm===n).length})</option>`).join('')+'</select><label>Pilih Absensi</label><select id="fk"></select><label>Pilih Tanggal</label><select id="fd"></select>':'');
 if(!last.length)h+='<p>Tidak ada data terlambat / tidak finger / tidak swipe.</p>';
 else h+=last.map((r,i)=>`<div class="it" data-n="${r.nm}" data-k="${r.ci}" data-d="${r.d}"><b>${r.nm}</b> &middot; ${r.d}<br><span>${E(r.c)}${r.jam?' &middot; masuk '+r.jam:''}${r.ket?' &middot; '+E(r.ket):''}</span>
 <label>Keterangan</label><input class="k2" data-i="${i}">
 <label>Bukti foto (maks. 3)</label><input type="file" accept="image/*" multiple class="ft" data-i="${i}"><div class="pv" id="pv${i}"></div>
 <label>Pengurang telat</label><select class="kr" data-i="${i}"><option value="0">Tidak bisa mengurangi</option><option value="1">Bisa mengurangi</option></select></div>`).join('')+
 '<button type="button" class="go" id="sv">Simpan ke Spreadsheet</button>';
 $('#out').innerHTML=h;sum();
 const fn=$('#fn'),fk=$('#fk'),fd=$('#fd');
 if(fn){
  const sel=()=>last.filter(r=>(!fn.value||r.nm===fn.value)&&(!fk.value||String(r.ci)===fk.value));
  const filt=()=>document.querySelectorAll('.it').forEach(e=>e.style.display=(!fn.value||e.dataset.n===fn.value)&&(!fk.value||e.dataset.k===fk.value)&&(!fd.value||e.dataset.d===fd.value)?'':'none');
  const kats=()=>{const L=last.filter(r=>!fn.value||r.nm===fn.value);
   fk.innerHTML='<option value="">Semua absensi ('+L.length+')</option>'+CAT.map((c,i)=>[c,i,L.filter(r=>r.ci===i).length]).filter(o=>o[2]).map(o=>`<option value="${o[1]}">${E(o[0])} (${o[2]})</option>`).join('')};
  const dates=()=>{const L=sel(),ds=[...new Set(L.map(r=>r.d))].sort();
   fd.innerHTML='<option value="">Semua tanggal ('+L.length+')</option>'+ds.map(d=>`<option value="${d}">${d} (${L.filter(r=>r.d===d).length})</option>`).join('')};
  kats();dates();fn.onchange=()=>{kats();dates();filt()};fk.onchange=()=>{dates();filt()};fd.onchange=filt}
 document.querySelectorAll('.k2').forEach(e=>e.oninput=()=>last[+e.dataset.i].ket2=e.value);
 document.querySelectorAll('.kr').forEach(e=>e.onchange=()=>{last[+e.dataset.i].kurang=e.value==='1';sum()});
 document.querySelectorAll('.ft').forEach(e=>e.onchange=async()=>{const i=+e.dataset.i,fl=[...e.files].slice(0,3);
  last[i].fotos=await Promise.all(fl.map(resize));$('#pv'+i).innerHTML=fl.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')});
 const sv=$('#sv');if(sv)sv.onclick=async()=>{sv.disabled=true;sv.textContent='Menyimpan…';
  try{await call('saveRekap',last.map(r=>({tanggal:r.d,nama:r.nm,kategori:r.c,jam:r.jam,ketFile:r.ket,ket:r.ket2,kurang:r.kurang,fotos:r.fotos})));msg('Absensi tersimpan ✓',1);loadTb()}
  catch(x){msg('Gagal: '+x.message)}
  sv.disabled=false;sv.textContent='Simpan ke Spreadsheet'}}
function loadTb(){const b=$('#tbtn');b.disabled=true;
 call('getTotals').then(d=>{TB=d;b.disabled=false;drawTb('')}).catch(x=>{b.disabled=false;msg('Gagal: '+x.message)})}
$('#tbtn').onclick=loadTb;
function drawTb(v){
 if(!TB.months.length){$('#tb').innerHTML='<p>Belum ada data tersimpan.</p>';return}
 const ms=v?[v]:TB.months,T=NAMA_ABS.map(nm=>[0,1,2,3].map(i=>ms.reduce((a,m)=>a+((TB.data[m]||{})[nm]||[0,0,0,0])[i],0)));
 let h='<h3>Total Bulanan</h3><select id="tbs"><option value="">Akumulasi semua bulan</option>'+TB.months.map(m=>`<option value="${m}"${m===v?' selected':''}>${m}</option>`).join('')+'</select><div class="tw"><table><tr><th>Nama</th>'+CAT.map(c=>`<th>${E(c)}</th>`).join('')+'<th>Total</th></tr>';
 NAMA_ABS.forEach((nm,k)=>h+=`<tr><td>${nm}</td>${T[k].map(x=>`<td>${x}</td>`).join('')}<td><b>${T[k].reduce((a,b)=>a+b,0)}</b></td></tr>`);
 $('#tb').innerHTML=h+'</table></div>';$('#tbs').onchange=e=>drawTb(e.target.value)}
</script></body></html>
